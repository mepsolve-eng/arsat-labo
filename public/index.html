#header .kpi .val{font-size:12px;font-weight:700}
#header .kpi .lbl{font-size:8px;color:#bfdbfe;text-transform:uppercase}
#nav{background:#ffffff;border-bottom:2px solid #e2e8f0;display:flex;overflow-x:auto;gap:0;position:sticky;top:64px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-btn{padding:9px 14px;background:none;border:none;border-bottom:3px solid transparent;color:#64748b;cursor:pointer;font-family:inherit;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;transition:all .2s}
.nav-btn.active{color:#1e40af;border-bottom-color:#1e40af;background:#eff6ff}

#content{padding:16px 18px}

.card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;color:#334155}
/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
/* KPI CARDS */
.kpi-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.kpi-card .k-icon{font-size:20px;margin-bottom:5px}
.kpi-card .k-label{font-size:8px;color:#64748b;text-transform:uppercase;margin-bottom:3px;font-weight:600}
.kpi-card .k-value{font-size:20px;font-weight:700;line-height:1.1}
.kpi-card .k-sub{font-size:8px;color:#475569;margin-top:3px}
/* TABLES */
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:8px 8px;color:#1e40af;font-size:8px;text-transform:uppercase;border-bottom:2px solid #bfdbfe;white-space:nowrap;background:#eff6ff;font-weight:700}
td{padding:7px 8px;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:#334155}
tr:nth-child(even){background:#f8fafc}
tr:hover{background:#eff6ff}
/* FORM ELEMENTS */
input[type=text],input[type=date],input[type=number],select,textarea{background:#ffffff;color:#1e293b;border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;font-family:inherit;font-size:11px;width:100%;transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1e40af;box-shadow:0 0 0 3px rgba(30,64,175,.08)}
input[type=range]{cursor:pointer;accent-color:#1e40af;width:70px}
textarea{resize:vertical;min-height:60px}
label{font-size:9px;color:#64748b;text-transform:uppercase;display:block;margin-bottom:4px;font-weight:600;letter-spacing:.3px}
.form-row{margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;transition:all .2s}
.btn-primary{background:#f59e0b;color:#1c1917}
.btn-primary:hover{background:#d97706;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.btn-danger{background:#fff;color:#dc2626;border:1.5px solid #dc2626}
.btn-danger:hover{background:#dc2626;color:#fff}
.btn-ghost{background:#fff;color:#475569;border:1.5px solid #cbd5e1}
.btn-ghost:hover{color:#1e40af;border-color:#1e40af;background:#eff6ff}
.btn-sm{padding:3px 8px;font-size:9px}
/* BADGES */
.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:9px;font-weight:700}
/* PROGRESS */
.prog-wrap{display:flex;align-items:center;gap:7px}
.prog-bar{flex:1;background:#e2e8f0;border-radius:4px;height:7px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .3s}
.prog-pct{font-weight:700;font-size:10px;min-width:30px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:22px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:14px;font-weight:700;color:#1e293b;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #f1f5f9}
/* ALERTS */
.alert{border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:10px;display:flex;gap:8px;align-items:flex-start}
.alert-danger{background:#fff5f5;border:1px solid #fca5a5;color:#991b1b}
.alert-warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}
.alert-info{background:#eff6ff;border:1px solid #93c5fd;color:#1e40af}
.alert-ok{background:#f0fdf4;border:1px solid #86efac;color:#166534}

/* TOOLTIP */
.tip{font-size:9px;color:#475569;font-style:italic}
/* PRINT */
@media print{#nav,#header .kpi-bar,.btn,input[type=range],select{display:none!important}#content{padding:0}.card{border:1px solid #e2e8f0;page-break-inside:avoid;box-shadow:none}}

function badge(text,fg,bg){
  bg=bg||fg+'22';

function lotBadge(s){const m=LOT_STATUS[s]||LOT_STATUS.not_started;return badge(m.label,m.fg);}
function riskColor(p,i){const s=p*i;return s>=15?COLOR.danger:s>=9?COLOR.warn:COLOR.ok;}
function progressBar(v,color,showInput,key,fn){
  color=color||COLOR.acc;
  if(showInput){
    return `<div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" style="width:${v}%;background:${color}"></div></div>
      <input type="range" min="0" max="100" value="${v}" style="accent-color:${color}" oninput="this.nextElementSibling.textContent=this.value+'%';${fn||''}" onchange="${fn||''}">
      <span class="prog-pct" style="color:${color}">${v}%</span>
    </div>`;
  }
  return `<div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" style="width:${v}%;background:${color}"></div></div>
    <span class="prog-pct" style="color:${color}">${v}%</span>
  </div>`;
}
function selectOptions(map,current){
  return Object.entries(map).map(([k,v])=>`<option value="${k}"${k===current?' selected':''}>${v.label}</option>`).join('');
}

  const histEntry={
    id: D.meta.saveCount,
    datetime: new Date().toLocaleString('fr-FR'),
    date: today(),
    description: description || 'Mise à jour des données',
    avancement: avgProg+'%',
    risquesOuverts: openRisks,
    paye: fmt(paidAmt)+' FCFA',
    tachesTerminees: tasks.filter(t=>t.progress===100).length+'/'+tasks.length,
  };
  D.meta.history.unshift(histEntry);
  D.meta.history = D.meta.history.slice(0,5); // keep last 5
  localStorage.setItem('arsat_v3',JSON.stringify(D));
  updateHeader();
  showSaveNotif();
}
// Migration map: equipment id → products[]
const EQ_PRODUCTS_MAP = {
  1:['jet'], 2:['jet','essence','gasoil','fuel','gpl'], 4:['jet','essence','gasoil'],
  5:[], 6:['jet'], 7:['gasoil','fuel','essence'], 8:[], 9:['jet','essence','gasoil','gpl'],
  10:['jet','essence','gasoil','fuel','gpl'], 11:['jet','essence','gasoil'],
  12:['essence','jet'], 13:['essence','gasoil','fuel'], 14:['jet','essence'],
  15:['jet','essence'], 16:['jet','gasoil'], 17:[], 18:[],
  20:['jet','gasoil','fuel'], 21:[], 22:['jet','essence','gasoil','fuel'],
  23:['gasoil'], 24:['jet','gasoil','essence'], 25:['jet'], 26:['essence','gpl','gasoil'],
  27:['gasoil','fuel'], 29:['jet'], 30:[], 31:['essence','jet'],
  32:['gasoil','fuel'], 33:[], 34:[], 35:[], 36:['jet'],
};

function migrateEquipments(){
  (D.equipments||[]).forEach((e,i)=>{
    if(!e.products) e.products = EQ_PRODUCTS_MAP[e.id] || [];
    if(!('jet' in e)) e.jet = (e.products||[]).includes('jet');
    if(!e.priceHistory) e.priceHistory=[];
    if(!e.addedDate) e.addedDate='';
    if(!e.ref) e.ref='';
    // Fix large timestamp IDs – keep as-is but ensure p1EUR is a number
    if(typeof e.p1EUR!=='number') e.p1EUR=parseFloat(e.p1EUR)||0;
    if(typeof e.p2EUR!=='number') e.p2EUR=parseFloat(e.p2EUR)||0;
  });
}

function load(){
  const s=localStorage.getItem('arsat_v3');
  D = s ? JSON.parse(s) : defaultData();
  if(!D.expenses) D.expenses=[];
  if(!D.journal) D.journal=[];
  if(!D.documents) D.documents=defaultData().documents;
  if(!D.meta.history) D.meta.history=[];
  if(!D.meta.saveCount) D.meta.saveCount=0;
  if(!D.meta.savedFolder) D.meta.savedFolder='';
  if(!D.subPayments) D.subPayments=[];
  if(!D.users) D.users=[];
  migrateEquipments();
  updateHeader();
}

function updateHeader(){
  const tasks=D.tasks||[];
  const avg = tasks.length ? Math.round(tasks.reduce((s,t)=>s+t.progress,0)/tasks.length) : 0;
  const days = daysLeft('2027-08-03');
  const openRisks = (D.risks||[]).filter(r=>r.status==='open').length;
  document.getElementById('h-progress').textContent=avg+'%';
  document.getElementById('h-days').textContent=days!==null?(days>0?days+'j':Math.abs(days)+'j retard'):'–';
  document.getElementById('h-days').style.color=days<30?COLOR.danger:days<90?COLOR.warn:COLOR.info;
  document.getElementById('h-risks').textContent=openRisks;
  document.getElementById('h-lastupdate').textContent=fmtDate(D.meta.lastUpdated);
}

function showTab(t){
  // Block edit tabs for view-only users
  if(window._viewOnly&&['admin','journal'].includes(t)){
    alert('Accès restreint – votre profil est en lecture seule.');return;
  }
  currentTab=t;
  if(t==='equip'){migrateEquipments();}
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const map={'dashboard':'◉','planning':'📅','lots':'⚡','budget':'💰','tresorerie':'🏦','equip':'⚗','risques':'⚠','docs':'📋','journal':'📝','admin':'🔐'};
    const btn_tab=Object.entries(map).find(([k])=>b.textContent.includes(map[k]))?.[0];
    b.classList.toggle('active',btn_tab===t);
  });
  render();
}

function render(){
  const el=document.getElementById('content');
  const fns={dashboard:renderDashboard,planning:renderPlanning,lots:renderLots,budget:renderBudget,tresorerie:renderTresorerie,equip:renderEquip,risques:renderRisques,docs:renderDocs,journal:renderJournal,admin:renderAdmin};

  const openRisks=risks.filter(r=>r.status==='open').length;
  const critRisks=risks.filter(r=>r.prob*r.impact>=15&&r.status==='open').length;
  const paidAmt=pays.filter(p=>p.status==='paid').reduce((s,p)=>s+p.amount,0);
  const subSorties=(D.subPayments||[]).filter(p=>p.type==='sortie').reduce((s,p)=>s+(+p.amount||0),0);

  let phaseHtml='';
  phases.forEach(ph=>{
    const pts=tasks.filter(t=>t.phase===ph);
    if(!pts.length)return;
    const avg=Math.round(pts.reduce((s,t)=>s+t.progress,0)/pts.length);
    const col=phaseColors[ph]||COLOR.acc;
    phaseHtml+=`<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px;font-size:10px">

      </div>
      ${progressBar(avg,col,false)}
    </div>`;
  });

  // Alerts
  const alerts=[];
  const today2=today();
  tasks.filter(t=>t.end&&t.end<today2&&t.progress<100).forEach(t=>{
    alerts.push({type:'danger',msg:`⏱ Tâche en retard : "${t.name}" – échéance ${fmtDate(t.end)}`});
  });
  if(critRisks>0) alerts.push({type:'danger',msg:`⚠ ${critRisks} risque(s) CRITIQUE(S) ouvert(s) – score ≥15`});
  const atexOk=docs.find(d=>d.name.includes('ATEX'));
  if(atexOk&&atexOk.status==='todo') alerts.push({type:'danger',msg:'🚨 Étude ATEX (EN 60079-10-1) non démarrée – bloquant pour lots CFO/CFA/GAZ'});

    alerts.push({type:'warn',msg:`💰 Paiement en retard : "${p.label}" – prévu ${fmtDate(p.plannedDate)}`});
  });
  risks.filter(r=>r.nextReview&&r.nextReview<=today2&&r.status!=='closed').forEach(r=>{
    alerts.push({type:'warn',msg:`⚠ Révision risque : "${r.title.substring(0,50)}..." – due ${fmtDate(r.nextReview)}`});
  });
  if(!alerts.length) alerts.push({type:'ok',msg:'✅ Aucune alerte critique aujourd\'hui'});

  const alertHtml=alerts.slice(0,6).map(a=>`<div class="alert alert-${a.type}">${a.msg}</div>`).join('');

  // Recent journal
  const jEntries=(D.journal||[]).slice(-3).reverse();

    </div>`).join('');

  return `
  <div class="g4" style="margin-bottom:12px">
    ${kpiCard('💰','Budget TTC',`${fmtM(BUDGET_TTC,0)} FCFA`,'Art. 7 contrat signé',COLOR.acc)}
    ${kpiCard('✅','Avancement global',avgTask+'%',`${tasks.filter(t=>t.progress===100).length}/${tasks.length} tâches terminées`,COLOR.ok)}
    ${kpiCard('⚠','Risques ouverts',openRisks,`Dont ${critRisks} critique(s)`,critRisks>0?COLOR.danger:COLOR.warn)}
    ${kpiCard('💳','Reçu ARSAT',fmtM(paidAmt,0)+' FCFA',`${((paidAmt/BUDGET_TTC)*100).toFixed(0)}% du contrat TTC`,COLOR.purple)}
    ${kpiCard('🏦','Solde trésorerie',fmtM(cashSolde,0)+' FCFA','Entrées − Sorties prestataires',cashSolde>=0?COLOR.ok:COLOR.danger)}
    ${kpiCard('⚗','Équipements installés',`${eqInstalled}/${equips.length}`,`${equips.filter(e=>e.jet).length} appareils Jet A1`,COLOR.info)}
    ${kpiCard('📋','Documents approuvés',`${docsApproved}/${docs.length}`,`${docs.filter(d=>d.status==='todo').length} à produire`,docsApproved<5?COLOR.warn:COLOR.ok)}
    ${kpiCard('⏱','Jours restants',daysToEnd!==null?(daysToEnd>0?daysToEnd+'j':Math.abs(daysToEnd)+'j retard'):'–','Fin projet : 03/08/2027',daysToEnd<30?COLOR.danger:daysToEnd<90?COLOR.warn:COLOR.info)}
    ${kpiCard('🚨','Pénalité retard/j',fmtM(penaDay,0)+' FCFA','Plafond : '+fmtM(BUDGET_TTC*.10,0)+' (100j)',COLOR.danger)}
  </div>

  <div class="g2">
    <div>
      <div class="card">
        <div class="card-title" style="color:${COLOR.acc}">⏱ Avancement par phase</div>
        ${phaseHtml}
      </div>
      <div class="card">
        <div class="card-title" style="color:${COLOR.ok}">📝 Journal récent</div>
        ${journalHtml||'<div style="color:#64748b;font-size:10px">Aucune entrée. Ajoutez dans le Journal de Chantier.</div>'}
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="showTab('journal')">Voir tout le journal →</button>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="card-title" style="color:${COLOR.danger}">🚨 Alertes & Actions requises</div>
        ${alertHtml}
      </div>
      <div class="card">
        <div class="card-title" style="color:${COLOR.purple}">✈ Chemin critique – Certification Jet A1</div>
        ${[
          {d:'30/04/26',t:'Bon de commande équipements',done:false},
          {d:'02/06/26',t:'Fin études géotechniques (G2)',done:false},
          {d:'10/07/26',t:'Validation BCT Veritas + Permis',done:false},
          {d:'22/07/26',t:'Démarrage chantier',done:false},
          {d:'04/01/27',t:'Fin Gros Œuvre',done:false},
          {d:'14/06/27',t:'Fin lots techniques',done:false},
          {d:'08/06/27',t:'Livraison équipements',done:false},
          {d:'19/07/27',t:'✈ CERTIFICATION JET A1',done:false},
        ].map(j=>{
          const d=daysLeft(j.d.split('/').reverse().join('-').replace(/(\d{2})$/,'20$1'));
          const col=d!==null&&d<0?COLOR.ok:d!==null&&d<30?COLOR.danger:COLOR.acc;
          return `<div style="display:flex;gap:8px;margin-bottom:6px;align-items:center;font-size:10px">

        }).join('')}
      </div>

  </div>`;
}

function updateTaskProgress(id,v){
  if(!D.tasks)return;
  const t=D.tasks.find(x=>x.id===id);
  if(t){t.progress=v;if(v===100)t.status='termine';else if(v>0&&t.status==='non_demarre')t.status='en_cours';save();}
  updateHeader();
}
function updateTaskStatus(id,v){
  if(!D.tasks)return;
  const t=D.tasks.find(x=>x.id===id);
  if(t){t.status=v;save();}
}
function deleteTask(id){
  if(!canEdit()){alert('Accès en lecture seule.');return;}
  const t=(D.tasks||[]).find(x=>x.id===id);
  confirmDialog(`Supprimer la tâche <strong>"${t?t.name:'?'}"</strong> ?<br>
    <span style="font-size:9px;color:#64748b">Vous pourrez annuler avec "↩ Annuler".</span>`,
    ()=>{
      pushUndo('Suppression tâche: '+(t?t.name:'?'));
      D.tasks=D.tasks.filter(x=>x.id!==id);
      save('Suppression tâche');render();
    });
}
function openTaskModal(id){
  const t=id?D.tasks.find(x=>x.id===id):{id:Date.now(),name:'',phase:'Études',start:'',end:'',progress:0,status:'non_demarre',responsible:'',comment:''};
  const phases=['Études','Gros Œuvre','Second Œuvre','Lots Techniques','Équipements','Formation','Réception','Certification'];
  document.getElementById('modal-task-body').innerHTML=`
    <h3>${id?'Modifier la tâche':'Nouvelle tâche'}</h3>
    <div class="form-row"><label>Nom de la tâche</label><input type="text" id="t-name" value="${t.name}"></div>
    <div class="form-grid">
      <div class="form-row"><label>Phase</label><select id="t-phase">${phases.map(p=>`<option value="${p}"${p===t.phase?' selected':''}>${p}</option>`).join('')}</select></div>
      <div class="form-row"><label>Responsable</label><input type="text" id="t-resp" value="${t.responsible||''}"></div>
      <div class="form-row"><label>Date début</label><input type="date" id="t-start" value="${t.start}"></div>
      <div class="form-row"><label>Date fin</label><input type="date" id="t-end" value="${t.end}"></div>
      <div class="form-row"><label>Avancement (%)</label><input type="number" id="t-prog" value="${t.progress}" min="0" max="100"></div>
      <div class="form-row"><label>Statut</label><select id="t-status">${selectOptions(TASK_STATUS,t.status)}</select></div>
    </div>
    <div class="form-row"><label>Commentaire / Note</label><textarea id="t-comment">${t.comment||''}</textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-task')">Annuler</button>
      <button class="btn btn-primary" onclick="saveTask(${t.id},${!!id})">Enregistrer</button>
    </div>`;
  openModal('modal-task');
}
function saveTask(id,isEdit){if(!canEdit()){alert('Accès en lecture seule.');return;}
  const t={id,name:v('t-name'),phase:v('t-phase'),start:v('t-start'),end:v('t-end'),progress:+v('t-prog'),status:v('t-status'),responsible:v('t-resp'),comment:v('t-comment')};
  if(isEdit){const i=D.tasks.findIndex(x=>x.id===id);D.tasks[i]=t;}else{D.tasks.push(t);}
  save();closeModal('modal-task');render();
}

function updateLotProgress(id,v){
  const l=D.lots.find(x=>x.id===id);
  if(l){l.progress=v;if(v===100)l.status='completed';else if(v>0&&l.status==='not_started')l.status='in_progress';save();}
  updateHeader();
}
function addLotComment(id){
  const inp=document.getElementById('lot-comment-'+id);

  if(l){if(!l.comments)l.comments=[];l.comments.push({date:today(),text:inp.value.trim()});l.lastComment=inp.value.trim();save();render();}
}

function renderEquip(){
  const equips=D.equipments||[];
  if(!window._eqFilter) window._eqFilter='all';
  if(!window._eqSupplier) window._eqSupplier='all';
  const filter=window._eqFilter;
  const supplierFilter=window._eqSupplier;

  // All unique suppliers
  const allSuppliers=[...new Set(equips.map(e=>e.supplier).filter(Boolean))].sort();

  // Filter logic
  const filtered = equips.filter(e=>{
    const prodOk=(()=>{
      if(filter==='all') return true;
      if(filter==='ordered') return ['ordered','in_production','shipped','delivered','installed','commissioned'].includes(e.status);
      const prods=e.products||[];
      if(filter==='jet') return e.jet || prods.includes('jet');
      return prods.includes(filter);
    })();
    const supplierOk = supplierFilter==='all' || e.supplier===supplierFilter;
    return prodOk && supplierOk;
  });

  const totalFCFA=Math.round(equips.reduce((s,e)=>s+e.p1EUR,0)*EUR_XAF);

function deleteEquip(id){

// ─── LIVE EUR↔FCFA conversion helper ────────────────────────────────
function setupPriceSync(eurId, fcfaId){
  const eurEl=document.getElementById(eurId);
  const fcfaEl=document.getElementById(fcfaId);
  if(!eurEl||!fcfaEl)return;
  eurEl.oninput=()=>{
    const v2=parseFloat(eurEl.value)||0;
    fcfaEl.value=Math.round(v2*EUR_XAF).toString();
  };
  fcfaEl.oninput=()=>{
    const v2=parseFloat(fcfaEl.value)||0;
    eurEl.value=(v2/EUR_XAF).toFixed(0);
  };
}

function saveNewEquip(){if(!canEdit()){alert('Accès en lecture seule.');return;}
  const name=v('na-name').trim();
  const model=v('na-model').trim();
  const supplier=v('na-supplier').trim();
  if(!name){alert('La désignation est obligatoire.');document.getElementById('na-name').focus();return;}
  if(!model){alert('Le modèle est obligatoire.');document.getElementById('na-model').focus();return;}
  if(!supplier){alert('Le fournisseur est obligatoire.');document.getElementById('na-supplier').focus();return;}
  const priceEUR=+v('na-price-eur')||0;
  const price2EUR=+v('na-price2')||0;
  const prods=Object.keys(PRODUCTS).filter(k=>document.getElementById('na-prod-'+k)?.checked);
  const existingIds=D.equipments.map(e=>typeof e.id==='number'&&e.id<10000?e.id:0);
  const newId=(existingIds.length?Math.max(...existingIds):36)+1;
  D.equipments.push({
    id:newId, name, model, supplier,
    ref: v('na-ref')||'',
    p1EUR: priceEUR,
    p2EUR: price2EUR,
    products: prods,
    jet: prods.includes('jet'),
    status: v('na-status')||'pending',
    orderDate: v('na-order')||'',
    deliveryPlanned: v('na-delivery')||'2027-01-25',
    deliveryActual:'', installDate:'', serialNum:v('na-serial')||'',
    calibDate:'', note:v('na-note')||'',
    priceHistory:[],
    addedDate: today(),
    addReason: v('na-reason')||'Ajout manuel',
  });
  save('Ajout équipement: '+name+' ('+model+') – '+supplier);
  closeModal('modal-equip-add');render();
}

function switchEqTab(idx){
  for(let i=0;i<5;i++){
    const tab=document.getElementById('eq-tab-'+i);
    const btn=document.getElementById('eq-tab-btn-'+i);
    if(tab) tab.style.display=i===idx?'block':'none';
    if(btn){btn.style.color=i===idx?'#1e40af':'#64748b';btn.style.borderBottomColor=i===idx?'#f59e0b':'transparent';}
  }
}

function saveEquip(id){if(!canEdit()){alert('Accès en lecture seule.');closeModal('modal-equip');return;}
  const e=D.equipments.find(x=>x.id===id);
  if(!e){closeModal('modal-equip');return;}

  // Price change tracking
  const newEUR=+v('eq-price-eur')||e.p1EUR;
  if(newEUR!==e.p1EUR){
    const reason=v('eq-price-reason').trim();
    if(!reason){
      alert('⚠ Veuillez indiquer la raison de la modification de prix (onglet "💰 Prix").');
      switchEqTab(1);
      document.getElementById('eq-price-reason').focus();
      return;
    }
    if(!e.priceHistory) e.priceHistory=[];
    e.priceHistory.push({
      date:today(),
      oldEUR:e.p1EUR,
      newEUR:newEUR,
      delta:newEUR-e.p1EUR,
      reason:reason,
    });
    e.p1EUR=newEUR;
  }

  // Identity
  if(document.getElementById('eq-name')) e.name=v('eq-name')||e.name;
  if(document.getElementById('eq-model')) e.model=v('eq-model')||e.model;
  e.supplier=v('eq-supplier')||e.supplier;
  e.ref=v('eq-ref')||e.ref||'';
  e.status=v('eq-status')||e.status;
  e.serialNum=v('eq-serial')||'';
  e.p2EUR=+v('eq-price2-eur')||e.p2EUR||0;

  // Logistics
  e.orderDate=v('eq-order')||'';
  e.deliveryPlanned=v('eq-dplan')||'';
  e.deliveryActual=v('eq-dact')||'';
  e.installDate=v('eq-inst')||'';
  e.calibDate=v('eq-calib')||'';

  // Products
  const newProds=Object.keys(PRODUCTS).filter(k=>document.getElementById('eq-prod-'+k)?.checked);
  if(newProds.length>0) e.products=newProds;
  e.jet=e.products.includes('jet');

  // Note
  e.note=v('eq-note')||'';

  save('Mise à jour équipement: '+e.name);
  closeModal('modal-equip');render();
}

// ═══ RISQUES ═════════════════════════════════════════════════════════
function renderRisques(){
  const risks=D.risks||[];
  const sorted=[...risks].sort((a,b)=>b.prob*b.impact-a.prob*a.impact);
  const open=risks.filter(r=>r.status==='open').length;
  const crit=risks.filter(r=>r.prob*r.impact>=15&&r.status==='open').length;

  return `
  <div class="g3" style="margin-bottom:12px">
    ${kpiCard('🔴','Risques critiques (≥15)',crit,'Score Prob × Impact',COLOR.danger)}
    ${kpiCard('🟠','Risques ouverts',open,`sur ${risks.length} total`,COLOR.warn)}
    ${kpiCard('🟢','Risques clôturés',risks.filter(r=>r.status==='closed').length,'','#10b981')}
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="btn btn-primary btn-sm" onclick="openRiskModal()">+ Ajouter un risque</button>
    <span style="color:${COLOR.muted};font-size:10px;margin-left:auto">Score = Probabilité (1-5) × Impact (1-5)</span>
  </div>
  ${sorted.map(r=>{
    const sc=r.prob*r.impact;const col=riskColor(r.prob,r.impact);
    const late=r.nextReview&&r.nextReview<today()&&r.status!=='closed';
    return `
    <div class="card" style="border-left:3px solid ${col}">
      <div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap">
        <div style="flex:1">
          <span class="badge" style="margin-right:6px;color:${COLOR.muted};background:#e2e8f0">${r.cat}</span>
          <span style="font-weight:700;font-size:12px">${r.title}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
          <div style="background:${col}22;border:1px solid ${col};border-radius:5px;padding:4px 10px;text-align:center">
            <div style="font-size:8px;color:${COLOR.muted}">SCORE</div>
            <div style="font-size:18px;font-weight:700;color:${col}">${sc}</div>
            <div style="font-size:8px;color:${COLOR.muted}">${r.prob}×${r.impact}</div>
          </div>
          ${riskBadge(r.status)}
          <button class="btn btn-ghost btn-sm" onclick="openRiskModal(${r.id})">✏</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRisk(${r.id})">🗑</button>
        </div>
      </div>
      <div style="font-size:10px;margin-bottom:4px"><span style="color:${COLOR.muted}">Mitigation : </span><span style="color:${COLOR.ok}">${r.mitigation}</span></div>

  }catch(e){
    if(e.name!=='AbortError') alert('Impossible de sélectionner le dossier : '+e.message);
  }
}

async function doExport(){
  const filename = (document.getElementById('ex-filename').value||`ARSAT_Labo_${today()}.json`).replace(/[^a-z0-9_\-\.]/gi,'_');
  const desc = document.getElementById('ex-desc').value || 'Export manuel';

  // Record this export in history BEFORE serializing
  if(!D.meta.history) D.meta.history=[];
  if(!D.meta.saveCount) D.meta.saveCount=0;
  D.meta.saveCount++;
  D.meta.lastUpdated=today();
  const tasks=D.tasks||[];
  const avgProg=tasks.length?Math.round(tasks.reduce((s,t)=>s+t.progress,0)/tasks.length):0;
  const histEntry={
    id:D.meta.saveCount,
    datetime:new Date().toLocaleString('fr-FR'),
    date:today(),
    description:desc,
    avancement:avgProg+'%',
    risquesOuverts:(D.risks||[]).filter(r=>r.status==='open').length,
    paye:fmt((D.payments||[]).filter(p=>p.status==='paid').reduce((s,p)=>s+p.amount,0))+' FCFA',
    tachesTerminees:tasks.filter(t=>t.progress===100).length+'/'+tasks.length,
    filename:filename,
  };
  D.meta.history.unshift(histEntry);
  D.meta.history=D.meta.history.slice(0,5);
  localStorage.setItem('arsat_v3',JSON.stringify(D));

  const json = JSON.stringify(D, null, 2);
  const blob = new Blob([json],{type:'application/json'});

  // Try File System Access API first (folder picker was used)
  if(_folderHandle){
    try{
      const fh = await _folderHandle.getFileHandle(filename,{create:true});
      const writable = await fh.createWritable();
      await writable.write(blob);
      await writable.close();
      closeModal('modal-export');
      showExportSuccess(`✅ Fichier enregistré dans : ${_folderHandle.name}/${filename}`);
      updateHeader();
      return;
    }catch(e){
      console.warn('File System API failed, falling back to download:',e);
    }
  }

  // Fallback: regular download
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  closeModal('modal-export');
  showExportSuccess(`✅ Fichier téléchargé : ${filename}`);
  updateHeader();
}

function showExportSuccess(msg){
  let n=document.getElementById('export-notif');
  if(!n){n=document.createElement('div');n.id='export-notif';
    n.style.cssText='position:fixed;bottom:50px;right:18px;background:#dbeafe;border:1px solid #0ea5e9;border-radius:6px;padding:10px 16px;font-size:11px;color:#1d4ed8;font-family:inherit;z-index:9999;max-width:380px;opacity:0;transition:opacity .3s';
    document.body.appendChild(n);}
  n.textContent=msg;
  n.style.opacity='1';
  clearTimeout(window._exportT);
  window._exportT=setTimeout(()=>n.style.opacity='0',4000);
}

// ─── IMPORT ──────────────────────────────────────────────────────────
function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const raw=e.target.result;
      const data=JSON.parse(raw);
      // Validate it's an ARSAT file
      if(!data.meta||!data.tasks){
        alert('❌ Fichier invalide – ce fichier ne semble pas être un export ARSAT.');
        event.target.value='';return;
      }
      const equCount=(data.equipments||[]).length;
      const taskCount=(data.tasks||[]).length;
      const lastUpdate=data.meta.lastUpdated||'–';
      confirmDialog(
        `<strong>Importer "${file.name}" ?</strong><br><br>
        <div style="background:#f8fafc;border-radius:6px;padding:8px 10px;margin:8px 0;font-size:10px;line-height:1.7">
          📅 Dernière MAJ : <strong>${lastUpdate}</strong><br>
          📋 Tâches : <strong>${taskCount}</strong><br>
          ⚗ Équipements : <strong>${equCount}</strong><br>
          💾 Sauvegardes : <strong>${data.meta.saveCount||0}</strong>
        </div>
        <span style="font-size:9px;color:#dc2626">⚠ Cela remplacera intégralement votre suivi actuel.</span>`,
        ()=>{
          D=data;
          // Init all missing fields
          if(!D.meta.history) D.meta.history=[];
          if(!D.meta.saveCount) D.meta.saveCount=0;
          if(!D.meta.savedFolder) D.meta.savedFolder='';
          if(!D.expenses) D.expenses=[];
          if(!D.journal) D.journal=[];
          if(!D.documents) D.documents=defaultData().documents;
          if(!D.risks) D.risks=defaultData().risks;
          if(!D.lots) D.lots=defaultData().lots;
          if(!D.payments) D.payments=defaultData().payments;
          if(!D.subPayments) D.subPayments=[];
          if(!D.users) D.users=[];
          // Always migrate equipment products
          migrateEquipments();
          // Renumber equipment sequentially
          D.equipments.forEach((e,i)=>{ if(typeof e.id==='number'&&e.id>10000) e.seq=i+1; else e.seq=e.seq||i+1; });
          // Persist & refresh
          localStorage.setItem('arsat_v3',JSON.stringify(D));
          updateHeader();
          render();
          showExportSuccess('✅ Import réussi : '+equCount+' équipements, '+taskCount+' tâches chargés depuis '+file.name);
        }
      );
    }catch(err){
      console.error(err);
      alert('❌ Erreur lors de l\'import.\nVérifiez que le fichier est un JSON valide exporté depuis cet outil.\n\nDétail : '+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function saveSubPay(type){
  const label=v('sp-label').trim();
  const amount=+v('sp-amount')||0;
  if(!label){alert('Le libellé est obligatoire.');return;}
  if(!amount){alert('Le montant est obligatoire.');return;}
  if(!D.subPayments) D.subPayments=[];
  D.subPayments.push({
    type,label,amount,
    date:v('sp-date')||today(),
    dueDate:v('sp-due')||'',
    category:v('sp-cat')||'',
    prestataire:v('sp-prest')||'',
    status:v('sp-status')||'pending',
    ref:v('sp-ref')||'',
    note:v('sp-note')||'',
  });
  save((type==='entree'?'Entrée':'Sortie')+' trésorerie: '+label+' – '+fmt(amount)+' FCFA');
  closeModal('modal-payment');
  render();
}

function updateSubPayStatus(idx,val){
  if(D.subPayments[idx]) D.subPayments[idx].status=val;
  save('Statut paiement: '+val);
}

function deleteSubPay(idx){
  const p=D.subPayments[idx];
  if(!p)return;
  confirmDialog(`Supprimer le mouvement "<strong>${p.label}</strong>" (${fmt(p.amount)} FCFA) ?`,()=>{
    D.subPayments.splice(idx,1);save('Suppression mouvement trésorerie');render();
  });
}

// ─── UNDO SYSTEM ────────────────────────────────────────────────────
const UNDO_STACK = [];
const MAX_UNDO = 10;

function pushUndo(description){
  UNDO_STACK.push({
    description: description,
    timestamp: new Date().toLocaleTimeString('fr-FR'),
    snapshot: JSON.stringify(D)
  });
  if(UNDO_STACK.length>MAX_UNDO) UNDO_STACK.shift();
  updateUndoBtn();
}

function undoLast(){
  if(!UNDO_STACK.length){alert('Aucune action à annuler.');return;}
  const last=UNDO_STACK.pop();
  confirmDialog(
    `<strong>Annuler : "${last.description}"</strong><br>
    <span style="font-size:10px;color:#64748b">Action effectuée à ${last.timestamp}<br>
    Les données seront restaurées à l'état précédent.</span>`,
    ()=>{
      D=JSON.parse(last.snapshot);
      localStorage.setItem('arsat_v3',JSON.stringify(D));
      updateHeader();render();
      showExportSuccess('↩ Annulation effectuée : '+last.description);
      updateUndoBtn();
    }
  );
}

function updateUndoBtn(){
  const btn=document.getElementById('undo-btn');
  if(!btn)return;
  if(UNDO_STACK.length>0){
    const last=UNDO_STACK[UNDO_STACK.length-1];
    btn.title='Annuler : '+last.description+' ('+last.timestamp+')';
    btn.style.opacity='1';
    btn.style.pointerEvents='auto';
    btn.textContent='↩ Annuler ('+UNDO_STACK.length+')';
  } else {
    btn.title='Aucune action à annuler';
    btn.style.opacity='.4';
    btn.style.pointerEvents='none';
    btn.textContent='↩ Annuler';
  }
}

const API = window.location.origin; // auto-detect server URL
let TOKEN = localStorage.getItem('arsat_token') || '';
let CURRENT_USER = null;

// ─── API helpers ─────────────────────────────────────────────────────
async function apiGet(url) {
  const r = await fetch(API+url, { headers: { Authorization: 'Bearer '+TOKEN } });
  if (r.status === 401 || r.status === 403) {
    const body = await r.json();
    if (body.revoked) {
      alert('⛔ Votre compte a été désactivé par l\'administrateur.\nContactez le Chef de Projet.');
    } else {
      alert('⏱ Session expirée. Reconnectez-vous.');
    }
    logout();
    return null;
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function apiPost(url, body) {
  const r = await fetch(API+url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer '+TOKEN },
    body: JSON.stringify(body)
  });
  if (r.status === 401 || r.status === 403) {
    const b = await r.json();
    if (b.revoked) { alert('⛔ Votre compte a été désactivé.'); logout(); }
    else alert(b.error || 'Accès refusé');
    return null;
  }
  return r.json();
}

async function apiPut(url, body) {
  const r = await fetch(API+url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer '+TOKEN },
    body: JSON.stringify(body)
  });
  return r.json();
}

async function apiDelete(url) {
  const r = await fetch(API+url, {
    method: 'DELETE',
    headers: { Authorization: 'Bearer '+TOKEN }
  });
  return r.json();
}

// ─── Save overridden to use server ───────────────────────────────────
async function save(description) {
  if (window._viewOnly) { console.warn('Save blocked – view only'); return; }
  D.meta.lastUpdated = today();
  if (!D.meta.history) D.meta.history = [];
  if (!D.meta.saveCount) D.meta.saveCount = 0;
  D.meta.saveCount++;
  const tasks = D.tasks || [];
  const avg = tasks.length ? Math.round(tasks.reduce((s,t)=>s+t.progress,0)/tasks.length) : 0;
  D.meta.history.unshift({
    id: D.meta.saveCount, datetime: new Date().toLocaleString('fr-FR'),
    date: today(), description: description||'Mise à jour', avancement: avg+'%',
    risquesOuverts: (D.risks||[]).filter(r=>r.status==='open').length,
    tachesTerminees: tasks.filter(t=>t.progress===100).length+'/'+tasks.length,
  });
  D.meta.history = D.meta.history.slice(0,5);
  // Save to server
  const result = await apiPost('/api/data', { data: D, description });
  if (result?.ok) {
    updateHeader();
    showSaveNotif();
  }
}

async function doLogin() {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-err');
  btn.textContent = '⏳ Connexion...';
  btn.disabled = true;
  try {
    const r = await fetch(API+'/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: +document.getElementById('login-user').value,
        pin:    document.getElementById('login-pin').value
      })
    });
    const data = await r.json();
    if (!r.ok) {
      errEl.textContent = data.error || 'Erreur de connexion';
      document.getElementById('login-pin').value = '';
      document.getElementById('login-pin').focus();
      btn.textContent = '🔐 ACCÉDER AU TABLEAU DE BORD';
      btn.disabled = false;
      return;
    }
    // Success
    TOKEN = data.token;
    CURRENT_USER = data.user;
    localStorage.setItem('arsat_token', TOKEN);
    window._viewOnly = (CURRENT_USER.role === 'view');

    // Load data from server
    const dataResult = await apiGet('/api/data');
    if (dataResult) {
      D = dataResult.data || defaultData();
      migrateEquipments();
      if (!D.expenses) D.expenses=[];
      if (!D.journal) D.journal=[];
      if (!D.subPayments) D.subPayments=[];
    } else {
      D = defaultData();
    }

    // Show app
    document.getElementById('login-screen').remove();
    document.body.style.background = '';
    document.getElementById('nav').style.display = 'flex';
    document.getElementById('header').style.display = 'flex';
    const adminBtn = document.getElementById('nav-admin');
    if (adminBtn) adminBtn.style.display = CURRENT_USER.role==='admin'?'':'none';

    // Add user badge
    const userBadge = document.createElement('div');
    userBadge.id = 'user-badge';
    userBadge.style.cssText = 'display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:6px;padding:4px 10px;font-size:10px;color:white';
    userBadge.innerHTML = `👤 <strong>${CURRENT_USER.name}</strong> &nbsp;|&nbsp; <button onclick="logout()" style="background:none;border:none;color:#fcd34d;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700">Déconnexion</button>`;
    document.getElementById('header').appendChild(userBadge);

    updateHeader();
    render();
    setTimeout(updateUndoBtn, 100);

  } catch(e) {
    errEl.textContent = 'Erreur réseau – vérifiez votre connexion';
    btn.textContent = '🔐 ACCÉDER AU TABLEAU DE BORD';
    btn.disabled = false;
  }
}

function logout() {
  TOKEN = '';
  CURRENT_USER = null;
  window._viewOnly = false;
  localStorage.removeItem('arsat_token');
  const badge = document.getElementById('user-badge');
  if (badge) badge.remove();
  document.getElementById('nav').style.display = 'none';
  document.getElementById('header').style.display = 'none';
  showLoginScreen();
}

async function saveUserServer(id) {
  const name = v('u-name').trim();
  const pin  = v('u-pin').trim();
  const role = v('u-role');
  const activeEl = document.getElementById('u-active');
  const active = activeEl ? activeEl.value === 'true' : true;

  if (!name) { alert('Le nom est obligatoire.'); return; }
  if (!id && pin.length < 4) { alert('Le PIN doit avoir au moins 4 chiffres.'); return; }

  const body = { name, role, active };
  if (pin) body.pin = pin;

  let result;
  if (id && id !== 'null') {
    result = await apiPut('/api/users/'+id, body);
  } else {
    if (!pin) { alert('Le PIN est obligatoire pour un nouvel utilisateur.'); return; }
    result = await apiPost('/api/users', body);
  }

  if (result?.ok) {
    showExportSuccess('✅ Utilisateur sauvegardé : '+name);
    closeModal('modal-task');
    render(); // Re-render admin tab
  } else {
    alert('Erreur : '+(result?.error||'Inconnue'));
  }
}

async function toggleUserServer(id, newActive) {
  const result = await apiPut('/api/users/'+id, { active: newActive });
  if (result?.ok) {
    showExportSuccess(newActive ? '✅ Compte activé' : '⛔ Compte désactivé – prend effet immédiatement');
    render();
  }
}

// ─── Import override: load to server ────────────────────────────────
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.meta || !data.tasks) { alert('Fichier invalide'); return; }
      confirmDialog(`Importer "${file.name}" sur le serveur ?<br>
        <span style="font-size:9px;color:#64748b">Cela remplacera les données pour TOUS les utilisateurs connectés.</span>`,
        async () => {
          D = data;
          migrateEquipments();
          if (!D.expenses) D.expenses=[];
          if (!D.subPayments) D.subPayments=[];
          await save('Import fichier: '+file.name);
          updateHeader(); render();
          showExportSuccess('✅ Données importées sur le serveur depuis '+file.name);
        }
      );
    } catch(e) { alert('Erreur import: '+e.message); }
  };
  reader.readAsText(file);
  event.target.value='';
}

}
